[options]
; Odoo runtime config for foilss Odoo 18 ERP — dev environment
; Production: override via docker-compose.prod.yml

; Security — เปลี่ยน admin_passwd ก่อน production!
admin_passwd = foilss_admin_change_me

; Database
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo
db_name = foilss
db_filter = ^foilss$
list_db = False

; Addons path — custom + default
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons

; Data directory
data_dir = /var/lib/odoo

; Logging
log_level = info
logfile = False

; Workers — dev: 0 (single process), production: 2 * CPU + 1
workers = 0
max_cron_threads = 1

; Memory limits (bytes)
limit_memory_soft = 2147483648
limit_memory_hard = 2684354560
limit_time_cpu = 60
limit_time_real = 120

; Proxy mode — enable if behind nginx/traefik in production
proxy_mode = False

; Performance
dbfilter = ^foilss$
